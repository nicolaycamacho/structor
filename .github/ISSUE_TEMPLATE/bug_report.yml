name: Bug report
description: Report a problem with Structor
labels: ["type: bug", "risk: medium"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Structor. It is experimental, so detailed reports help a lot.
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true
  - type: input
    id: structor-version
    attributes:
      label: Structor release and commit
      description: The selected release tag and full 40-character commit from `git rev-parse HEAD` in the pinned checkout.
      placeholder: v0.3.1, <40-character commit>
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste the full output, including any error.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal harness.config.json
      description: If generation-related, include the smallest config that reproduces it. Redact private names.
      render: json
    validations:
      required: false
