name: validate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linked-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require linked issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          shopt -s nocasematch

          if [[ "${PR_BODY}" =~ (^|[^[:alnum:]_])(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+(#[0-9]+|${GITHUB_REPOSITORY}#[0-9]+|https://github[.]com/${GITHUB_REPOSITORY}/issues/[0-9]+)([^0-9]|$) ]]; then
            exit 0
          fi

          echo "Pull requests must link the issue they complete with a closing keyword, for example: Closes #123"
          exit 1

  validate:
    name: full-validation (Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            npm: 10
          - node: 22
            npm: 10
          - node: 24
            npm: 11
          - node: 24
            npm: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # An explicit tag ref preserves its annotated object instead of fetching SHA:tag.
          ref: ${{ github.ref_type == 'tag' && github.ref || '' }}
      - name: Verify tag checkout matches the event commit
        if: github.ref_type == 'tag'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Select npm toolchain
        run: npm install --global npm@${{ matrix.npm }}
      - name: Report toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run validate
